[project]
name = "triage"
version = "0.1.0"
description = "Customer support ticket triage: TypeSafe Jev vs Together.ai LLMs"
readme = "README.md"
authors = [
    { name = "beese54", email = "barrygacy@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "huggingface-hub>=2.0.0",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.3",
    "typesafe-sdk>=0.7.1",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "scikit-learn>=1.9.1",
]
